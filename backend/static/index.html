<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local RF/IR Controller</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260907-13" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Local RF/IR</p>
        <h1>Smart-home controller</h1>
      </div>
      <div class="status">
        <span id="apiStatus" class="pill">Loading</span>
        <span id="clock" class="muted"></span>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Controller sections">
      <button id="controlTab" class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="controlPanel" data-tab="control">
        Control
      </button>
      <button id="configurationTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="configurationPanel" data-tab="configuration">
        Configuration
      </button>
      <button id="logTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="logPanel" data-tab="log">
        Log
      </button>
    </nav>

    <div id="controlPanel" class="tab-panel" role="tabpanel" aria-labelledby="controlTab">
      <main class="layout control-layout">
        <section class="panel span-full">
          <div class="section-head">
            <h2>Actions</h2>
            <button id="refreshButton" class="secondary" type="button">Refresh</button>
          </div>
          <div id="actionGrid" class="action-layout"></div>
        </section>

        <section class="panel">
          <h2>Add timer</h2>
          <form id="timerForm" class="form compact-form">
            <label>
              Action
              <select name="target" id="timerTarget" required></select>
            </label>
            <label class="timer-delay-desktop">
              Delay in minutes
              <input name="minutes" type="number" max="10080" step="any" value="30" required />
            </label>
            <div class="timer-delay-mobile" role="group" aria-label="Timer delay">
              <label>
                Minutes
                <select name="mobile_minutes" id="timerMinutes"></select>
              </label>
              <label>
                Seconds
                <select name="mobile_seconds" id="timerSeconds"></select>
              </label>
            </div>
            <button type="submit">Start timer</button>
          </form>
        </section>

        <section class="panel">
          <h2>Active jobs</h2>
          <div id="activeJobList" class="list"></div>
        </section>

        <section class="panel span-full">
          <h2>Schedules</h2>
          <form id="scheduleForm" class="schedule-form">
            <select name="target" id="scheduleTarget" aria-label="Action" required></select>
            <input name="name" autocomplete="off" aria-label="Schedule name" placeholder="Weekday night" />
            <input name="time_of_day" type="time" aria-label="Start time" required />
            <fieldset>
              <label><input type="checkbox" name="days" value="0" checked /> Mon</label>
              <label><input type="checkbox" name="days" value="1" checked /> Tue</label>
              <label><input type="checkbox" name="days" value="2" checked /> Wed</label>
              <label><input type="checkbox" name="days" value="3" checked /> Thu</label>
              <label><input type="checkbox" name="days" value="4" checked /> Fri</label>
              <label><input type="checkbox" name="days" value="5" /> Sat</label>
              <label><input type="checkbox" name="days" value="6" /> Sun</label>
            </fieldset>
            <button type="submit">Save schedule</button>
          </form>
          <div id="scheduleList" class="list"></div>
        </section>

      </main>
    </div>

    <div id="configurationPanel" class="tab-panel" role="tabpanel" aria-labelledby="configurationTab" hidden>
      <main class="layout configuration-layout">
        <section class="panel">
          <h2>Add node</h2>
          <form id="nodeForm" class="form">
            <label>
              Name
              <input name="name" required autocomplete="off" placeholder="Bedroom ESP32" />
            </label>
            <label>
              ESP32 IP
              <input name="base_url" required autocomplete="off" placeholder="192.168.0.14" />
            </label>
            <button type="submit">Save node</button>
          </form>
          <div class="node-management">
            <h3>Nodes</h3>
            <div id="nodeList" class="node-list"></div>
          </div>
        </section>

        <section class="panel">
          <h2>Learn signal</h2>
          <form id="captureForm" class="form">
            <div id="captureSetup" class="form">
              <label>
                Node
                <select name="node_id" id="captureNode" required></select>
              </label>
              <label>
                Signal
                <select name="signal_type" id="captureType" required>
                  <option value="ir">IR raw</option>
                  <option value="rf">RF 433MHz</option>
                </select>
              </label>
              <label>
                Timeout seconds
                <input name="timeout" type="number" min="1" max="30" value="8" />
              </label>
              <div class="capture-actions">
                <button id="startCapture" type="button">Sense signal</button>
                <button id="stopCapture" class="danger" type="button" hidden>Stop capture</button>
              </div>
            </div>
            <div id="captureNaming" class="form" hidden>
              <label>
                Name
                <input name="name" autocomplete="off" maxlength="80" placeholder="Bedroom fan power" />
              </label>
              <div class="capture-actions">
                <button type="submit">Save signal</button>
                <button id="discardCapture" class="secondary" type="button">Capture again</button>
              </div>
            </div>
          </form>
        </section>

        <section class="panel span-full">
          <h2>Signals</h2>
          <div id="signalConfigList" class="list configuration-list"></div>
        </section>

        <section class="panel span-full">
          <div class="section-head">
            <h2>Workflows</h2>
          </div>
          <form id="workflowForm" class="form">
            <div class="workflow-editor">
              <input name="name" aria-label="Workflow name" autocomplete="off" placeholder="Workflow name" />
              <div id="workflowSteps" class="workflow-steps"></div>
            </div>
            <div class="workflow-footer">
              <button id="addWorkflowStep" class="secondary" type="button">Add step</button>
              <div class="workflow-actions">
                <button id="cancelWorkflowEdit" class="secondary" type="button" hidden>Cancel edit</button>
                <button id="saveWorkflowButton" type="submit">Save workflow</button>
              </div>
            </div>
          </form>
          <div id="workflowList" class="list"></div>
        </section>
      </main>
    </div>

    <div id="logPanel" class="tab-panel" role="tabpanel" aria-labelledby="logTab" hidden>
      <main class="layout">
        <section class="panel span-full">
          <h2>Event log</h2>
          <div id="eventList" class="list"></div>
        </section>
      </main>
    </div>

    <dialog id="acControllerDialog" class="ac-controller-dialog" aria-labelledby="acControllerTitle">
      <div class="ac-controller-shell">
        <header class="ac-controller-header">
          <div>
            <p class="eyebrow">Bedroom</p>
            <h2 id="acControllerTitle">Aircond controller</h2>
          </div>
          <button id="closeAcController" class="icon-button secondary" type="button" aria-label="Close aircond controller" title="Close">&times;</button>
        </header>

        <div class="ac-display" aria-live="polite">
          <span>COOL</span>
          <output id="acTemperatureDisplay">27&deg;</output>
          <div id="acDisplaySummary">Fan 1 &middot; Swing off</div>
        </div>

        <section class="ac-control-section" aria-labelledby="acTemperatureLabel">
          <h3 id="acTemperatureLabel">Temperature</h3>
          <div class="temperature-control">
            <button id="decreaseAcTemperature" class="secondary" type="button" aria-label="Decrease temperature">&minus;</button>
            <strong id="acTemperatureValue">27&deg;C</strong>
            <button id="increaseAcTemperature" class="secondary" type="button" aria-label="Increase temperature">+</button>
          </div>
        </section>

        <section class="ac-control-section" aria-labelledby="acFanLabel">
          <h3 id="acFanLabel">Fan</h3>
          <div class="ac-segmented" role="group" aria-label="Fan speed">
            <button type="button" data-ac-fan="auto">Auto</button>
            <button type="button" data-ac-fan="1">1</button>
            <button type="button" data-ac-fan="2">2</button>
            <button type="button" data-ac-fan="3">3</button>
          </div>
        </section>

        <label class="ac-switch-row" for="acSwing">
          <span>
            <strong>Swing</strong>
            <small>Vertical airflow</small>
          </span>
          <input id="acSwing" type="checkbox" role="switch" />
        </label>

        <button id="acPower" class="ac-power-button" type="button">
          <span class="power-symbol" aria-hidden="true">&#9211;</span>
          Power toggle
        </button>

        <p id="acLastSent" class="ac-last-sent">No command sent yet</p>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js?v=20260907-18" type="module"></script>
  </body>
</html>
