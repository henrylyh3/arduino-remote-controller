<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 RF and IR room node circuit diagram</title>
  <desc id="desc">Circuit diagram for ESP32 with RF transmitter, RF receiver, IR receiver, and a 2N3904 transistor driven IR LED transmitter.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; rx: 12; }
      .module { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.5; rx: 10; }
      .driver { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; rx: 10; }
      .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .pin { fill: #e5e7eb; stroke: #374151; stroke-width: 1.5; rx: 5; }
      .wire { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wire-red { fill: none; stroke: #dc2626; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-green { fill: none; stroke: #16a34a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-blue { fill: none; stroke: #2563eb; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-orange { fill: none; stroke: #ea580c; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gray { fill: none; stroke: #4b5563; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 22px; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 17px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #374151; font-size: 15px; }
      .net { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>
  <text class="label" x="48" y="52">ESP32 RF + IR Room Node</text>
  <text class="small" x="48" y="84">Recommended wiring for RF fan control, IR learning, and stronger 2m+ IR transmit using 2N3904.</text>

  <rect class="box" x="80" y="160" width="310" height="570"/>
  <text class="label" x="145" y="205">ESP32 DevKit</text>
  <text class="tiny" x="145" y="230">ESP-WROOM-32, 30-pin</text>

  <rect class="pin" x="120" y="270" width="120" height="34"/>
  <text class="net" x="145" y="293">5V / VIN</text>
  <rect class="pin" x="120" y="326" width="120" height="34"/>
  <text class="net" x="158" y="349">3V3</text>
  <rect class="pin" x="120" y="382" width="120" height="34"/>
  <text class="net" x="158" y="405">GND</text>
  <rect class="pin" x="120" y="438" width="120" height="34"/>
  <text class="net" x="143" y="461">GPIO26</text>
  <rect class="pin" x="120" y="494" width="120" height="34"/>
  <text class="net" x="143" y="517">GPIO27</text>
  <rect class="pin" x="120" y="550" width="120" height="34"/>
  <text class="net" x="151" y="573">GPIO4</text>
  <rect class="pin" x="120" y="606" width="120" height="34"/>
  <text class="net" x="143" y="629">GPIO14</text>

  <text class="tiny" x="258" y="293">Power for RF TX / LED driver</text>
  <text class="tiny" x="258" y="349">IR receiver VCC</text>
  <text class="tiny" x="258" y="405">Shared ground</text>
  <text class="tiny" x="258" y="461">RF transmitter DATA</text>
  <text class="tiny" x="258" y="517">RF receiver DATA via divider</text>
  <text class="tiny" x="258" y="573">IR TX drive</text>
  <text class="tiny" x="258" y="629">IR receiver OUT</text>

  <rect class="module" x="770" y="135" width="330" height="155"/>
  <text class="label" x="835" y="175">433 MHz RF TX</text>
  <text class="small" x="815" y="212">VCC -> 5V/VIN</text>
  <text class="small" x="815" y="240">GND -> GND</text>
  <text class="small" x="815" y="268">DATA -> GPIO26</text>
  <path class="wire-red" d="M240 287 C520 287 520 190 770 190"/>
  <path class="wire-gray" d="M240 399 C520 399 520 235 770 235"/>
  <path class="wire-green" d="M240 455 C520 455 520 263 770 263"/>
  <line class="wire" x1="1100" y1="170" x2="1160" y2="110"/>
  <text class="tiny" x="1136" y="105">Optional 17.3 cm antenna</text>

  <rect class="module" x="770" y="345" width="330" height="175"/>
  <text class="label" x="835" y="385">433 MHz RF RX</text>
  <text class="small" x="815" y="422">VCC -> 5V</text>
  <text class="small" x="815" y="450">GND -> GND</text>
  <text class="small" x="815" y="478">DATA -> voltage divider -> GPIO27</text>
  <path class="wire-red" d="M240 287 C570 287 570 420 770 420"/>
  <path class="wire-gray" d="M240 399 C570 399 570 448 770 448"/>
  <path class="wire-blue" d="M770 476 L690 476"/>
  <rect x="625" y="463" width="60" height="26" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text class="tiny" x="638" y="482">10k</text>
  <circle cx="600" cy="476" r="6" fill="#111827"/>
  <path class="wire-blue" d="M625 476 L600 476 C520 476 520 511 240 511"/>
  <path class="wire-gray" d="M600 476 L600 540"/>
  <rect x="587" y="540" width="26" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text class="tiny" x="572" y="632">20k or 22k</text>
  <path class="wire-gray" d="M600 602 C520 602 520 399 240 399"/>
  <text class="tiny" x="610" y="456">divider protects ESP32 GPIO27</text>
  <line class="wire" x1="1100" y1="375" x2="1160" y2="315"/>
  <text class="tiny" x="1136" y="310">Optional 17.3 cm antenna</text>

  <rect class="module" x="770" y="590" width="330" height="155"/>
  <text class="label" x="850" y="630">IR Receiver</text>
  <text class="small" x="815" y="667">VCC -> 3V3</text>
  <text class="small" x="815" y="695">GND -> GND</text>
  <text class="small" x="815" y="723">OUT -> GPIO14</text>
  <path class="wire-red" d="M240 343 C560 343 560 665 770 665"/>
  <path class="wire-gray" d="M240 399 C560 399 560 693 770 693"/>
  <path class="wire-green" d="M240 623 C560 623 560 721 770 721"/>

  <rect class="driver" x="430" y="605" width="250" height="215"/>
  <text class="label" x="477" y="645">IR TX Driver</text>
  <text class="small" x="466" y="680">2N3904 NPN</text>
  <path class="wire-orange" d="M240 567 C335 567 335 700 430 700"/>
  <rect x="365" y="686" width="52" height="26" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text class="tiny" x="377" y="705">1k</text>
  <text class="tiny" x="442" y="705">BASE</text>
  <circle cx="548" cy="732" r="34" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text class="tiny" x="521" y="738">2N3904</text>
  <path class="wire-gray" d="M548 766 L548 800 C480 800 480 399 240 399"/>
  <text class="tiny" x="562" y="800">EMITTER -> GND</text>
  <path class="wire-orange" d="M430 700 L514 720"/>
  <path class="wire-red" d="M240 287 C410 287 410 676 555 676"/>
  <rect x="530" y="662" width="52" height="26" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text class="tiny" x="535" y="681">100R</text>
  <path class="wire-red" d="M582 676 L620 676"/>
  <path d="M620 665 L620 687 L648 676 Z" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <line x1="650" y1="661" x2="650" y2="691" stroke="#9a3412" stroke-width="3"/>
  <text class="tiny" x="598" y="655">5mm 940nm IR LED</text>
  <path class="wire-orange" d="M650 676 L650 720 L582 720"/>
  <text class="tiny" x="592" y="724">COLLECTOR</text>

  <rect class="warn" x="80" y="765" width="310" height="78"/>
  <text class="small" x="105" y="797">ESP32 GPIO is not 5V tolerant.</text>
  <text class="tiny" x="105" y="824">Use the RF RX divider when RF DATA may be 5V.</text>

  <rect class="box" x="770" y="785" width="330" height="55"/>
  <text class="tiny" x="795" y="817">All modules must share ESP32 GND.</text>
</svg>
